name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36"

      - name: Set up ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
          # Configured through the environment rather than ccache's own config file, which the
          # cache restore below would otherwise overwrite. compiler_check=content is what lets a
          # hit survive a fresh checkout, where every file has a new timestamp.
          echo "CCACHE_PATH=$(which ccache)" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV

      # The native half - ffmpeg, dav1d, libvpx, openh264, opus, tlottie - is what takes the
      # three quarters of an hour. ccache keys on file content rather than timestamps, so it
      # still hits after the cache is restored into a fresh checkout with new mtimes.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write API credentials
        run: |
          cat >> local.properties <<EOF
          APP_ID=${{ secrets.TG_API_ID }}
          APP_HASH=${{ secrets.TG_API_HASH }}
          EOF

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --build-cache
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018

      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write emulator test script
        run: |
          cat > /tmp/emulator_test.sh <<'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -x
          echo "Workspace: $GITHUB_WORKSPACE, pwd: $(pwd)"
          APK=$(find "$GITHUB_WORKSPACE/TMessagesProj_App/build/outputs/apk/afat/debug" -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "APK not found, listing directory tree for debugging:"
            find "$GITHUB_WORKSPACE/TMessagesProj_App/build/outputs" -type f || true
            exit 1
          fi
          echo "Installing $APK"
          adb install -r "$APK"
          echo "Enabling libc malloc debug (backtrace+guard) to diagnose the SIGSEGV from the previous run"
          adb shell setprop libc.debug.malloc.options "backtrace guard"
          adb reboot
          adb wait-for-device
          for i in $(seq 1 90); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOTED" = "1" ]; then break; fi
            sleep 2
          done
          sleep 5
          adb logcat -c
          adb shell am start -n org.telegram.messenger.tjgram/org.telegram.ui.LaunchActivity
          sleep 20
          adb logcat -d > /tmp/logcat_full.txt
          echo "=== Searching for the actual crash signal line (with context) ==="
          grep -n -A 150 -i "Fatal signal\|Aborting\|backtrace:\|memory corruption\|heap corruption\|GWP-ASan" /tmp/logcat_full.txt | head -500 || echo "No 'Fatal signal/Aborting/backtrace:' line found"
          echo "=== Searching for Java-level FATAL EXCEPTION (with context) ==="
          grep -n -A 60 "FATAL EXCEPTION" /tmp/logcat_full.txt | head -200 || echo "No FATAL EXCEPTION found"
          echo "=== General crash-relevant lines (fallback) ==="
          grep -iE "FATAL EXCEPTION|AndroidRuntime|tjgram|org\.telegram|Caused by|signal [0-9]+|backtrace" /tmp/logcat_full.txt | tail -300 || echo "No matching lines found"
          cp /tmp/logcat_full.txt "$GITHUB_WORKSPACE/logcat_full.txt"
          SCRIPT_EOF
          chmod +x /tmp/emulator_test.sh

      - name: Run app on emulator and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash /tmp/emulator_test.sh

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat_full.txt
          if-no-files-found: ignore
